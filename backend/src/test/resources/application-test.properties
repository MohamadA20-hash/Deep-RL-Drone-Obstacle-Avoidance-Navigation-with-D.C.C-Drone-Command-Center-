# Test configuration for drone-command-center

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (use JPA auto-create)
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=dGVzdFNlY3JldEtleUZvclRlc3RpbmdPbmx5MTIzNDU2Nzg5
jwt.expiration=3600000
app.jwt.refresh-token-expiration-days=1

# Disable email for tests
app.email.enabled=false

# Disable data seeding for tests
app.seed.enabled=false

# Disable RabbitMQ for tests
app.rabbitmq.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Logging
logging.level.com.drone_command_center=WARN
logging.level.org.springframework=WARN
