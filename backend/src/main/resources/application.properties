spring.application.name=drone-command-center

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:Qm9iVGhlRHJvbmVDb21tYW5kQ2VudGVyU2VjdXJlS2V5MTIzNDU2Nzg5MDE=}
jwt.expiration=3600000
app.jwt.refresh-token-expiration-days=7

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/drone_command_center
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
# Disabled — schema is owned by Hibernate ddl-auto=update.
# V2__demo_cleanup.sql has already been applied manually (admin/ops users
# removed, user_roles / user_drone_assignments / password_reset_tokens
# tables dropped). Re-running V2 would TRUNCATE telemetry + commands and
# wipe all live demo data, so Flyway is left disabled.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=false
springdoc.packages-to-scan=com.drone_command_center.Controller
springdoc.paths-to-match=/api/**

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true

# Logging Configuration
logging.level.com.drone_command_center=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers,caches
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
# Mail server is unconfigured in dev — disabling its health indicator
# stops /actuator/health from going DOWN with a misleading 503.
management.health.mail.enabled=false

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# Email Configuration (disabled by default, configure for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.enabled=false
app.email.from=noreply@dronecommandcenter.com
app.frontend.url=http://localhost:3000

# Data Seeding Configuration
# Seeds the demo operator + bridge service user + 1 sample drone + 2 sample missions
# on first startup. Idempotent — re-running on a populated DB is a no-op.
# Disable in production by setting APP_SEED_ENABLED=false.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.operator.username=${APP_SEED_OPERATOR_USERNAME:operator}
app.seed.operator.password=${APP_SEED_OPERATOR_PASSWORD:Operator@2026!}
app.seed.operator.email=${APP_SEED_OPERATOR_EMAIL:operator@dronecommandcenter.com}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Scheduler Configuration
app.scheduler.telemetry-retention-days=30
app.scheduler.heartbeat-timeout-seconds=60

# AirSim Bridge Configuration
app.airsim.bridge.auto-start=true
app.airsim.bridge.python-path=${AIRSIM_PYTHON_PATH:python}
app.airsim.bridge.script-path=${AIRSIM_SCRIPT_PATH:}
app.airsim.bridge.auth-user=${BRIDGE_AUTH_USER:navrl_bridge}
app.airsim.bridge.auth-pass=${BRIDGE_AUTH_PASS:NavRL@2026!}

